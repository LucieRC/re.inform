<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - re.inform</title>
    <meta name="description" content="Admin panel for reviewing counter-narrative submissions.">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/onboarding.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <h1>re.inform admin</h1>
                </div>
                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Claims</a></li>
                    <li><a href="personalities.html">Personas</a></li>
                    <li><a href="library.html">Library</a></li>
                    <li><a href="resources.html">Articles</a></li>
                    <li><a href="contribute.html" class="nav-cta">Contribute</a></li>
                    <li class="theme-toggle" aria-label="Color scheme">
                        <div class="theme-toggle-group" role="group" aria-label="Color scheme">
                            <button type="button" class="theme-toggle-btn" data-color-scheme-option="light" aria-pressed="false" title="Light">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" class="theme-toggle-btn" data-color-scheme-option="system" aria-pressed="false" title="Same as computer">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" class="theme-toggle-btn" data-color-scheme-option="dark" aria-pressed="false" title="Night">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M21 13.2A8.5 8.5 0 0 1 10.8 3 7 7 0 1 0 21 13.2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </li>
                    <li><button id="logoutBtn" class="btn btn-secondary" style="display: none;">Logout</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="admin-section">
            <div class="container">
                <!-- Login Form -->
                <div class="admin-login">
                    <h2>Admin login</h2>
                    <form id="adminLoginForm">
                        <div class="form-group">
                            <label for="adminPassword">Password:</label>
                            <input 
                                type="password" 
                                id="adminPassword" 
                                name="password" 
                                required
                                placeholder="Enter admin password"
                            >
                        </div>
                        <div id="loginMessage" class="form-message"></div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>

                <!-- Admin Content (hidden until logged in) -->
                <div class="admin-content">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h2>Review submissions</h2>
                        <button id="logoutBtn2" class="btn btn-secondary">Logout</button>
                    </div>

                    <p class="loading-message">Loading submissions...</p>

                    <div id="submissionsList" class="submissions-list">
                        <!-- Submissions will be loaded here -->
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin: 3rem 0 1rem;">
                        <h2>Review resources</h2>
                        <div class="filter-group">
                            <label for="reviewStatusFilter">Show:</label>
                            <select id="reviewStatusFilter">
                                <option value="pending">Needs review</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                                <option value="">All</option>
                            </select>
                        </div>
                    </div>
                    <p id="reviewCounts" class="review-meta"></p>
                    <div id="reviewMessage" class="form-message"></div>
                    <div id="reviewQueue" class="review-queue">
                        <!-- Resources awaiting review are loaded here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 re.inform. Building bridges through evidence-based dialogue.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Additional logout button handler
        document.getElementById('logoutBtn2')?.addEventListener('click', () => {
            adminToken = null;
            sessionStorage.removeItem('adminToken');
            location.reload();
        });
        
        // Show logout button when logged in
        if (sessionStorage.getItem('adminToken')) {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
