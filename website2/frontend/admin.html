<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin.metaTitle">Administration - re.inform</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="description" content="Espace d’administration pour relire les contributions de la communauté." data-i18n-content="admin.metaDescription">
    <script src="js/i18n.js"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-in">
            <a class="site-logo" href="index.html">re<span>.</span>inform</a>
            <nav class="site-links" id="siteLinks" aria-label="Navigation principale" data-i18n-aria-label="nav.main">
                <a href="index.html" data-i18n="nav.debunk">Débunker</a>
                <a href="personalities.html" data-i18n="nav.personas">Profils</a>
                <a href="library.html" data-i18n="nav.resources">Ressources</a>
                <div class="site-auth site-auth-mobile" data-auth-links></div>
            </nav>
            <form class="site-search" action="index.html" role="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" name="q" id="siteSearch" placeholder="Rechercher une idée reçue…" data-i18n-placeholder="nav.searchPlaceholder" aria-label="Rechercher une idée reçue" data-i18n-aria-label="nav.searchLabel" autocomplete="off">
            </form>
            <div class="site-auth" id="authLinks" data-auth-links></div>
            <button type="button" class="site-icon-btn site-theme" data-color-scheme-toggle aria-label="Changer de thème" data-i18n-aria-label="theme.toggle">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" class="site-icon-btn site-menu-btn" aria-label="Menu" data-i18n-aria-label="nav.menu" aria-controls="siteLinks" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="admin-section">
            <div class="container">
                <!-- Login Form -->
                <div class="admin-login">
                    <h2 data-i18n="admin.loginTitle">Connexion administrateur</h2>
                    <form id="adminLoginForm">
                        <div class="form-group">
                            <label for="adminPassword" data-i18n="admin.password">Mot de passe :</label>
                            <input 
                                type="password" 
                                id="adminPassword" 
                                name="password" 
                                required
                                placeholder="Mot de passe administrateur" data-i18n-placeholder="admin.passwordPlaceholder"
                            >
                        </div>
                        <div id="loginMessage" class="form-message"></div>
                        <button type="submit" class="btn btn-primary" data-i18n="common.login">Se connecter</button>
                    </form>
                </div>

                <!-- Admin Content (hidden until logged in) -->
                <div class="admin-content">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h2 data-i18n="admin.submissionsTitle">Relire les contributions</h2>
                        <button id="logoutBtn2" class="btn btn-secondary" data-i18n="admin.logout">Se déconnecter</button>
                    </div>

                    <p class="loading-message" data-i18n="admin.submissionsLoading">Chargement des contributions…</p>

                    <div id="submissionsList" class="submissions-list">
                        <!-- Submissions will be loaded here -->
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin: 3rem 0 1rem;">
                        <h2 data-i18n="admin.resourcesTitle">Relire les ressources</h2>
                        <div class="filter-group">
                            <label for="reviewStatusFilter" data-i18n="admin.show">Afficher :</label>
                            <select id="reviewStatusFilter">
                                <option value="pending" data-i18n="admin.filterPending">À relire</option>
                                <option value="approved" data-i18n="admin.filterApproved">Validées</option>
                                <option value="rejected" data-i18n="admin.filterRejected">Refusées</option>
                                <option value="" data-i18n="admin.filterAll">Toutes</option>
                            </select>
                        </div>
                    </div>
                    <p id="reviewCounts" class="review-meta"></p>
                    <div id="reviewMessage" class="form-message"></div>
                    <div id="reviewQueue" class="review-queue">
                        <!-- Resources awaiting review are loaded here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 re.inform</p>
            <p data-i18n="site.tagline">Renouer le dialogue, preuves à l’appui.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Additional logout button handler
        document.getElementById('logoutBtn2')?.addEventListener('click', () => {
            adminToken = null;
            sessionStorage.removeItem('adminToken');
            location.reload();
        });
        
        // Show logout button when logged in
        if (sessionStorage.getItem('adminToken')) {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
