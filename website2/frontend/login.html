<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.metaTitle">Connexion - re.inform</title>
    <meta name="description" content="Connectez-vous à votre compte re.inform." data-i18n-content="login.metaDescription">
    <script src="js/i18n.js"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-in">
            <a class="site-logo" href="index.html">re<span>.</span>inform</a>
            <nav class="site-links" id="siteLinks" aria-label="Navigation principale" data-i18n-aria-label="nav.main">
                <a href="index.html" data-i18n="nav.debunk">Débunker</a>
                <a href="personalities.html" data-i18n="nav.personas">Profils</a>
                <a href="library.html" data-i18n="nav.resources">Ressources</a>
                <a href="index.html?mode=help" data-i18n="nav.contribute">Participer</a>
                <div class="site-auth site-auth-mobile" data-auth-links></div>
            </nav>
            <form class="site-search" action="index.html" role="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" name="q" id="siteSearch" placeholder="Rechercher une idée reçue…" data-i18n-placeholder="nav.searchPlaceholder" aria-label="Rechercher une idée reçue" data-i18n-aria-label="nav.searchLabel" autocomplete="off">
            </form>
            <div class="site-auth" id="authLinks" data-auth-links></div>
            <button type="button" class="site-icon-btn site-theme" data-color-scheme-toggle aria-label="Changer de thème" data-i18n-aria-label="theme.toggle">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13.2A8.5 8.5 0 0 1 10.8 3 7 7 0 1 0 21 13.2Z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" class="site-icon-btn site-menu-btn" aria-label="Menu" data-i18n-aria-label="nav.menu" aria-controls="siteLinks" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="contribute-hero">
            <div class="container">
                <h2 data-i18n="login.title">Connexion à re.inform</h2>
                <p data-i18n="login.lead">Retrouvez vos contributions et suivez votre progression.</p>
            </div>
        </section>

        <section class="contribution-form-section">
            <div class="container">
                <form id="loginForm" class="contribution-form" style="max-width: 500px;">
                    <p class="form-message success" id="pendingVotesNote" role="status" hidden></p>

                    <div class="form-group">
                        <label for="username" data-i18n="auth.username">Nom d’utilisateur</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required
                            placeholder="Votre nom d’utilisateur" data-i18n-placeholder="login.usernamePlaceholder"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" data-i18n="auth.password">Mot de passe</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            placeholder="Votre mot de passe" data-i18n-placeholder="login.passwordPlaceholder"
                        >
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember" name="remember">
                            <span data-i18n="login.remember">Se souvenir de moi</span>
                        </label>
                    </div>

                    <div class="form-message" id="formMessage"></div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="loginBtn" data-i18n="common.login">Se connecter</button>
                    </div>

                    <p style="text-align: center; margin-top: 1rem;">
                        <span data-i18n="login.noAccount">Pas encore de compte ?</span> <a href="register.html" data-i18n="login.registerLink">Inscrivez-vous</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 re.inform</p>
            <p data-i18n="site.tagline">Renouer le dialogue, preuves à l’appui.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
