<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Combining filters — re.inform</title>
<link rel="stylesheet" href="../css/ui.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
p { margin-top: 0; }
.topic { display: inline-flex; align-items: center; gap: 4px; }
/* ---- Option 2: checkmark pills ---- */
body.m2 .chip[aria-pressed="true"], body.m2 .topic[aria-pressed="true"] {
  background: var(--brand-soft); color: var(--brand); border-color: var(--brand);
}
body.m2 .topic { border: 1px solid transparent; }
body.m2 .chip[data-all][aria-pressed="true"], body.m2 .topic[data-all][aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.check { display: none; width: 14px; height: 14px; }
body.m2 [aria-pressed="true"]:not([data-all]) .check { display: inline-block; }
body.m2 [aria-pressed="true"]:not([data-all]) .chip-dot { display: none; }
.clear { border: 0; background: none; font: inherit; font-size: 14px; color: var(--brand); cursor: pointer; padding: 4px 8px; white-space: nowrap; }
.clear:hover { text-decoration: underline; }

/* ---- Option 3: dropdown menus + removable pills ---- */
.dd-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
.dd { position: relative; }
.dd-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); font: inherit; font-size: 14px; color: var(--text); cursor: pointer; }
.dd-btn:hover { border-color: var(--muted); }
.dd-btn b { font-weight: 600; }
.dd-btn .n { background: var(--text); color: var(--bg); border-radius: 999px; font-size: 12px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 6px; }
.dd-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 260px; max-height: 340px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: 0 12px 32px rgba(0,0,0,.12); padding: 6px; }
.dd-menu label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.dd-menu label:hover { background: var(--tint); }
.dd-menu input { accent-color: var(--brand-fill); width: 16px; height: 16px; }
.dd-menu .cnt { margin-left: auto; color: var(--muted); font-size: 13px; }
.active-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 14px; border: 0; font-family: inherit; cursor: pointer; }
.active-pill span.x { opacity: .7; font-size: 16px; line-height: 1; }
.active-pill:hover span.x { opacity: 1; }

.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.count-line { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.switch { position: fixed; bottom: 16px; left: 16px; display: flex; gap: 4px; align-items: center; background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 4px 4px 10px; border-radius: 8px; z-index: 50; }
.switch button { padding: 4px 8px; border-radius: 5px; opacity: .7; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--bg); color: var(--text); opacity: 1; }
.mini-head { max-width: var(--page-max); margin: 0 auto; padding: 14px var(--gutter); }
</style>
</head>
<body class="m1">
<div class="mini-head"><span class="site-logo">re<span>.</span>inform</span></div>
<main class="page">
  <section class="home-intro">
    <div><h1>The claims you'll hear, and how to answer them.</h1>
    <p>Pick who you're talking to, we'll show the replies that work for them.</p></div>
  </section>

  <div id="filters"></div>
  <p class="count-line" id="count"></p>
  <div id="list" class="claim-grid"></div>
</main>

<div class="switch" id="switch">Filters:
  <button data-m="m1" aria-pressed="true">1 · Toggle pills</button>
  <button data-m="m2" aria-pressed="false">2 · Checkmarks</button>
  <button data-m="m3" aria-pressed="false">3 · Menus</button>
</div>

<script src="proto-data.js"></script>
<script>
(async () => {
  const { claims, personas } = await Proto.load();
  const used = new Set(claims.flatMap(c => c.personas.map(p => p.id)));
  const people = personas.filter(p => used.has(p.id));
  const topics = Proto.tags(claims);
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const col = id => Proto.colorFor(personas, id);
  const sel = { people: new Set(), topics: new Set() };
  let mode = 'm1', openMenu = null;
  const $ = id => document.getElementById(id);
  const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';

  function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

  // ---------- Options 1 & 2: pills that toggle ----------
  function pills() {
    const nP = sel.people.size, nT = sel.topics.size;
    return `
      <p class="eyebrow">Who are you talking to?</p>
      <div class="chip-row">
        <button class="chip" data-all="people" aria-pressed="${!nP}">Everyone</button>
        ${people.map(p => `<button class="chip" data-p="${p.id}" aria-pressed="${sel.people.has(p.id)}">${CHECK}<span class="chip-dot" style="background:${col(p.id)}"></span>${Proto.esc(p.name)}</button>`).join('')}
        ${mode === 'm2' && nP ? `<button class="clear" data-clear="people">Clear (${nP})</button>` : ''}
      </div>
      ${mode === 'm1' ? `<p class="hint">Click several to combine them. Click again to remove.</p>` : ''}
      <div class="topic-row">
        <button class="topic" data-all="topics" aria-pressed="${!nT}">All topics</button>
        ${topics.map(t => `<button class="topic" data-t="${t}" aria-pressed="${sel.topics.has(t)}">${mode === 'm2' ? CHECK : ''}${cap(t)}</button>`).join('')}
        ${mode === 'm2' && nT ? `<button class="clear" data-clear="topics">Clear (${nT})</button>` : ''}
      </div>`;
  }

  // ---------- Option 3: two menus + removable pills ----------
  function menus() {
    const nP = sel.people.size, nT = sel.topics.size;
    const menu = (key, items) => openMenu !== key ? '' : `<div class="dd-menu">${items}</div>`;
    return `
      <div class="dd-row">
        <div class="dd"><button class="dd-btn" data-open="people">Who: <b>${nP ? (nP === 1 ? Proto.esc(people.find(p => sel.people.has(p.id)).name) : nP + ' people') : 'Everyone'}</b> ▾</button>
          ${menu('people', people.map(p => `<label><input type="checkbox" data-p="${p.id}" ${sel.people.has(p.id) ? 'checked' : ''}><span class="chip-dot" style="background:${col(p.id)}"></span>${Proto.esc(p.name)}<span class="cnt">${claims.filter(c => c.personas.some(x => x.id === p.id)).length}</span></label>`).join(''))}</div>
        <div class="dd"><button class="dd-btn" data-open="topics">Topic: <b>${nT ? (nT === 1 ? cap([...sel.topics][0]) : nT + ' topics') : 'All'}</b> ▾</button>
          ${menu('topics', topics.map(t => `<label><input type="checkbox" data-t="${t}" ${sel.topics.has(t) ? 'checked' : ''}>${cap(t)}<span class="cnt">${claims.filter(c => c.tags.includes(t)).length}</span></label>`).join(''))}</div>
        ${[...sel.people].map(id => { const p = people.find(x => x.id === id); return `<button class="active-pill" data-p="${id}"><span class="chip-dot" style="background:${col(id)}"></span>${Proto.esc(p.name)}<span class="x" aria-label="Remove">×</span></button>`; }).join('')}
        ${[...sel.topics].map(t => `<button class="active-pill" data-t="${t}">${cap(t)}<span class="x" aria-label="Remove">×</span></button>`).join('')}
        ${nP + nT ? `<button class="clear" data-clear="all">Clear all</button>` : ''}
      </div>`;
  }

  function renderFilters() { $('filters').innerHTML = mode === 'm3' ? menus() : pills(); }

  $('filters').addEventListener('click', e => {
    const b = e.target.closest('button, input'); if (!b) return;
    if (b.dataset.open) { openMenu = openMenu === b.dataset.open ? null : b.dataset.open; renderFilters(); return; }
    if (b.dataset.all) sel[b.dataset.all].clear();
    else if (b.dataset.clear) { if (b.dataset.clear === 'all') { sel.people.clear(); sel.topics.clear(); } else sel[b.dataset.clear].clear(); }
    else if (b.dataset.p) toggle(sel.people, +b.dataset.p);
    else if (b.dataset.t) toggle(sel.topics, b.dataset.t);
    else return;
    renderFilters(); renderList();
  });
  document.addEventListener('click', e => { if (openMenu && !e.target.closest('.dd')) { openMenu = null; renderFilters(); } });

  function renderList() {
    const rows = claims.filter(c =>
      (!sel.people.size || c.personas.some(p => sel.people.has(p.id))) &&
      (!sel.topics.size || c.tags.some(t => sel.topics.has(t))));
    $('count').textContent = `${rows.length} claim${rows.length === 1 ? '' : 's'}`;
    $('list').innerHTML = rows.slice(0, 8).map(c => {
      const r = c.top_response;
      return `<a class="claim-card" href="../argument.html?id=${c.id}">
        <p class="claim-text">“${Proto.esc(Proto.clean(c.text))}”</p>
        ${r ? `<div class="claim-reply"><span class="claim-reply-label">How to answer</span><p>${Proto.esc(r.text)}</p></div>` : ''}
        <div class="claim-foot">${c.personas.slice(0, 2).map(p => `<span class="claim-persona"><span class="chip-dot" style="background:${col(p.id)}"></span>${Proto.esc(p.name)}</span>`).join('')}
          <span>${c.counter_argument_count} answer${c.counter_argument_count === 1 ? '' : 's'}</span>
          ${c.tags[0] ? `<span class="claim-tag">${cap(c.tags[0])}</span>` : ''}</div></a>`;
    }).join('');
  }

  $('switch').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    mode = document.body.className = b.dataset.m; openMenu = null;
    $('switch').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderFilters(); });

  renderFilters(); renderList();
})();
</script>
</body>
</html>
