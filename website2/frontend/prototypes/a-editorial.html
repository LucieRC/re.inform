<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype A · Editorial — re.inform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=swap">
<style>
:root {
  --bg: #ffffff; --surface: #f6f6f3; --text: #1b1d1c; --muted: #66706a; --line: #e7e8e4;
  --brand: #29683e; --brand-soft: #e8f1eb; --gold: #b8962e;
  --serif: 'Newsreader', Georgia, serif; --sans: 'Inter', system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #111312; --surface: #1a1d1b; --text: #ecefec; --muted: #9aa49d; --line: #2a2f2c;
  --brand: #6fbf8a; --brand-soft: #1d2d23; --gold: #d6b969;
}
* { box-sizing: border-box; margin: 0; }
p, h1 { overflow-wrap: anywhere; }
body { background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* Header */
.bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1080px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 32px; }
.logo { font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
.logo span { color: var(--brand); }
nav { display: flex; gap: 4px; flex: 1; }
nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 15px; }
nav a:hover { color: var(--text); }
nav a[aria-current] { color: var(--text); font-weight: 500; }
.right { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--surface); color: var(--text); }
.btn { padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 500; }
.btn-primary { background: var(--brand); color: var(--bg); }
.btn-ghost { color: var(--muted); }

/* Hero */
.hero { max-width: 720px; margin: 0 auto; padding: 72px 24px 32px; text-align: center; }
.hero h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.02em; }
.hero p { color: var(--muted); margin-top: 14px; font-size: 17px; }
.search { display: block; margin: 28px auto 0; position: relative; max-width: 560px; }
.search input { width: 100%; height: 52px; padding: 0 20px 0 48px; border-radius: 26px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; }
.search input:focus { outline: none; border-color: var(--brand); background: var(--bg); box-shadow: 0 0 0 4px var(--brand-soft); }
.search svg { position: absolute; left: 18px; top: 16px; color: var(--muted); }

/* Filters */
.wrap { max-width: 720px; margin: 0 auto; padding: 0 24px 80px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 20px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.chip { white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.count { color: var(--muted); font-size: 14px; padding: 16px 0 0; }

/* List */
.item { padding: 28px 0; border-bottom: 1px solid var(--line); }
.claim { font-family: var(--serif); font-size: 22px; line-height: 1.35; letter-spacing: -0.01em; }
.claim::before { content: '« '; color: var(--muted); }
.claim::after { content: ' »'; color: var(--muted); }
.answer { margin-top: 12px; padding-left: 16px; border-left: 2px solid var(--brand); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin-top: 14px; display: flex; gap: 16px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.meta .who { display: inline-flex; align-items: center; gap: 6px; }
.meta .open { margin-left: auto; color: var(--brand); font-weight: 500; }
.item:hover .open { text-decoration: underline; }
.more { display: block; margin: 32px auto 0; padding: 10px 20px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); }
.more:hover { border-color: var(--muted); }
.empty { text-align: center; padding: 48px 0; color: var(--muted); }

.proto-tag { position: fixed; bottom: 16px; left: 16px; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 10px; border-radius: 6px; opacity: .85; }
@media (max-width: 720px) {
  nav { display: none; }
  .hero { padding-top: 40px; }
  .claim { font-size: 19px; }
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="logo" href="#">re<span>.</span>inform</a>
  <nav>
    <a href="#" aria-current="page">Claims</a><a href="#">Personas</a><a href="#">Library</a><a href="#">Articles</a>
  </nav>
  <div class="right">
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13.2A8.5 8.5 0 0 1 10.8 3 7 7 0 1 0 21 13.2Z"/></svg></button>
    <a class="btn btn-ghost" href="#">Log in</a>
    <a class="btn btn-primary" href="#">Contribute</a>
  </div>
</div></header>

<section class="hero">
  <h1>Heard something you couldn't answer?</h1>
  <p>Find the claim, see the reply that works for the person in front of you.</p>
  <label class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="« Le climat a toujours changé »…" aria-label="Search a claim">
  </label>
</section>

<main class="wrap">
  <div class="filters" id="filters" role="group" aria-label="Filter by person"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <button class="more" id="more" hidden>Show more</button>
</main>
<div class="proto-tag">Prototype A · Editorial</div>

<script src="proto-data.js"></script>
<script>
Proto.initTheme(document.getElementById('theme'));
(async () => {
  const { claims, personas } = await Proto.load();
  const state = { q: '', persona: null, shown: 10 };
  const $ = id => document.getElementById(id);

  $('filters').innerHTML = `<button class="chip" data-p="" aria-pressed="true">Everyone</button>` +
    personas.map(p => `<button class="chip" data-p="${p.id}" aria-pressed="false"><span class="dot" style="background:${p.accent_color}"></span>${Proto.esc(p.name)}</button>`).join('');
  $('filters').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.persona = b.dataset.p ? +b.dataset.p : null; state.shown = 10;
    $('filters').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    render();
  });
  $('q').addEventListener('input', e => { state.q = e.target.value; state.shown = 10; render(); });
  $('more').addEventListener('click', () => { state.shown += 10; render(); });

  function render() {
    const rows = Proto.filter(claims, state);
    $('count').textContent = `${rows.length} claim${rows.length === 1 ? '' : 's'}`;
    $('list').innerHTML = rows.slice(0, state.shown).map(c => {
      const r = c.top_response, p = c.personas[0];
      return `<a class="item" href="../argument.html?id=${c.id}" style="display:block">
        <p class="claim">${Proto.esc(Proto.clean(c.text))}</p>
        ${r ? `<p class="answer">${Proto.esc(r.text)}</p>` : ''}
        <div class="meta">
          ${p ? `<span class="who"><span class="dot" style="background:${Proto.colorFor(personas, p.id)}"></span>For ${Proto.esc(Proto.firstName(p.name))}</span>` : ''}
          <span>${c.counter_argument_count} answer${c.counter_argument_count === 1 ? '' : 's'}</span>
          ${c.tags[0] ? `<span>#${Proto.esc(c.tags[0])}</span>` : ''}
          <span class="open">Read →</span>
        </div></a>`;
    }).join('') || `<p class="empty">Nothing yet. Be the first to add this claim.</p>`;
    $('more').hidden = rows.length <= state.shown;
  }
  render();
})();
</script>
</body>
</html>
