<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Sorting & contributor filters — re.inform</title>
<link rel="stylesheet" href="../css/ui.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
p { margin-top: 0; }
.topic { display: inline-flex; align-items: center; gap: 4px; }
.mini-head { max-width: var(--page-max); margin: 0 auto; padding: 14px var(--gutter); display: flex; justify-content: space-between; align-items: center; }
.demo { font-size: 12px; color: var(--muted); background: var(--tint); padding: 4px 10px; border-radius: 999px; }
.ico { width: 15px; height: 15px; flex: none; }

/* Card signal line (what the current sort is about) */
.signal { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--brand); margin: 0 0 10px; }
.signal.warn { color: #9a6a12; }
:root[data-color-scheme="dark"] .signal.warn { color: var(--gold); }

/* ---- Option 1: sort menu ---- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; flex-wrap: wrap; }
.count-line { color: var(--muted); font-size: 14px; margin: 0; }
.sort { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.sort select { appearance: none; font: inherit; font-size: 14px; color: var(--text); background: var(--card) var(--select-arrow) no-repeat right 12px center; border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 34px 7px 14px; cursor: pointer; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); cursor: pointer; user-select: none; }
.toggle input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle input:checked { background: var(--brand-fill); }
.toggle input:checked::after { transform: translateX(14px); }
.tools-right { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }

/* ---- Option 2: view tabs ---- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 20px; overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; font: inherit; font-size: 15px; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--brand); }
.tab .n { font-size: 12px; background: var(--tint); color: var(--muted); border-radius: 999px; padding: 1px 7px; font-weight: 500; }

/* ---- Option 3: Find answers / Help out ---- */
.mode { display: inline-flex; padding: 4px; background: var(--tint); border-radius: 12px; margin: 0 0 20px; }
.mode button { border: 0; background: none; font: inherit; font-size: 15px; font-weight: 500; color: var(--muted); padding: 8px 16px; border-radius: 9px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.mode button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 0 0 24px; }
.task { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-sm); padding: 14px; font: inherit; color: var(--text); cursor: pointer; box-shadow: var(--shadow); }
.task:hover { border-color: var(--muted); }
.task[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.task b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.task span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
.task .big { font-size: 22px; font-weight: 700; color: var(--text); display: block; margin-top: 8px; letter-spacing: -0.02em; }
.cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 8px 14px; border-radius: 10px; background: var(--brand-fill); color: #fff; font-size: 14px; font-weight: 600; }

.switch { position: fixed; bottom: 16px; left: 16px; display: flex; gap: 4px; align-items: center; background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 4px 4px 10px; border-radius: 8px; z-index: 50; }
.switch button { padding: 4px 8px; border-radius: 5px; opacity: .7; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--bg); color: var(--text); opacity: 1; }
</style>
</head>
<body>
<div class="mini-head"><span class="site-logo">re<span>.</span>inform</span><span class="demo">Activity numbers on this page are invented for the demo</span></div>
<main class="page">
  <section class="home-intro" style="margin-top:8px">
    <div><h1>The claims you'll hear, and how to answer them.</h1>
    <p>Pick who you're talking to, we'll show the replies that work for them.</p></div>
  </section>
  <p class="eyebrow">Who are you talking to?</p>
  <div class="chip-row" id="people"></div>
  <div class="topic-row" id="topics"></div>
  <div id="controls"></div>
  <div id="list" class="claim-grid"></div>
</main>

<div class="switch" id="switch">Option:
  <button data-m="1" aria-pressed="true">1 · Sort menu</button>
  <button data-m="2" aria-pressed="false">2 · Tabs</button>
  <button data-m="3" aria-pressed="false">3 · Find / Help out</button>
</div>

<script src="proto-data.js"></script>
<script>
const ICONS = {
  trend: '<path d="m3 17 6-6 4 4 8-8M15 7h6v6"/>',
  star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9Z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  check: '<path d="m5 12 5 5 9-10"/>',
  clip: '<path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.5 7"/>',
  pen: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  hand: '<path d="M7 11V6a2 2 0 0 1 4 0v5M11 10V4a2 2 0 0 1 4 0v6M15 10V6a2 2 0 0 1 4 0v7a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.5L3 14a2 2 0 0 1 3.4-2L7 13"/>',
};
const ic = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

(async () => {
  const { claims, personas } = await Proto.load();
  const used = new Set(claims.flatMap(c => c.personas.map(p => p.id)));
  const people = personas.filter(p => used.has(p.id));
  const topics = Proto.tags(claims);
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const col = id => Proto.colorFor(personas, id);
  const $ = id => document.getElementById(id);

  // ---- Invented activity (deterministic per claim) + real gaps ----
  const rnd = seed => { let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); };
  claims.forEach(c => {
    const r = i => rnd(c.id * 7 + i);
    c.week = Math.floor(Math.pow(r(1), 3) * 40);
    c.impCount = Math.floor(r(2) * 25);
    c.imp = c.impCount ? +(1 + r(3) * 4).toFixed(1) : null;
    c.ageDays = Math.floor(r(4) * 90);
    c.toRate = Math.max(0, c.counter_argument_count - Math.floor(r(5) * 2));
    c.toCheck = r(6) > .35 ? 1 : 0;
    // Real: which of the named people still have no tailored answer.
    c.missing = people.filter(p => !c.personas.some(x => x.id === p.id));
  });

  const state = { mode: '1', people: new Set(), topics: new Set(), sort: 'trending', help: false, tab: 'trending', task: 'missing', helpMode: false };

  const SORTS = {
    trending: { label: 'Trending this week', icon: 'trend', key: c => -c.week, signal: c => c.week ? `${ic('trend')} ${c.week} contributions this week` : '' },
    important: { label: 'Most important', icon: 'target', key: c => -(c.imp || 0), signal: c => c.imp ? `${ic('target')} Importance ${c.imp}/5 · ${c.impCount} votes` : '' },
    newest: { label: 'Newest', icon: 'clock', key: c => c.ageDays, signal: c => `${ic('clock')} Added ${c.ageDays === 0 ? 'today' : c.ageDays === 1 ? 'yesterday' : c.ageDays + ' days ago'}` },
    best: { label: 'Best answered', icon: 'star', key: c => -(c.impCount % 5), signal: c => `${ic('star')} Top answer rated ${(3 + (c.impCount % 5) / 2.5).toFixed(1)}/5` },
  };
  const TASKS = {
    missing: { label: 'Missing a person', sub: 'Write an answer for someone not covered yet', icon: 'users', test: c => c.missing.length, signal: c => `${ic('users')} No answer yet for ${c.missing.slice(0, 2).map(p => Proto.firstName(p.name)).join(', ')}${c.missing.length > 2 ? ` +${c.missing.length - 2}` : ''}`, cta: c => `${ic('pen')} Write for ${Proto.firstName(c.missing[0].name)}` },
    rate: { label: 'Answers to rate', sub: 'Quick: does this answer convince you?', icon: 'star', test: c => c.toRate, signal: c => `${ic('star')} ${c.toRate} answer${c.toRate > 1 ? 's' : ''} never rated`, cta: () => `${ic('star')} Rate it` },
    check: { label: 'Sources to check', sub: 'Open the link, confirm it says what we claim', icon: 'clip', test: c => c.toCheck, signal: () => `${ic('clip')} Source not verified yet`, cta: () => `${ic('check')} Check the source` },
    importance: { label: 'How urgent is it?', sub: 'One click: is this claim worth answering?', icon: 'target', test: c => !c.impCount, signal: () => `${ic('target')} Nobody voted on importance yet`, cta: () => `${ic('target')} Vote` },
  };
  // Demo rule (every real claim is missing 4 of 5 people today, so that alone would match all of them).
  const NEEDS_HELP = c => c.toCheck && c.impCount < 12;

  function pills() {
    $('people').innerHTML = `<button class="chip" data-all="people" aria-pressed="${!state.people.size}">Everyone</button>` +
      people.map(p => `<button class="chip" data-p="${p.id}" aria-pressed="${state.people.has(p.id)}"><span class="chip-dot" style="background:${col(p.id)}"></span>${Proto.esc(p.name)}</button>`).join('');
    $('topics').innerHTML = `<button class="topic" data-all="topics" aria-pressed="${!state.topics.size}">All topics</button>` +
      topics.map(t => `<button class="topic" data-t="${t}" aria-pressed="${state.topics.has(t)}">${cap(t)}</button>`).join('') +
      (state.people.size || state.topics.size ? `<button class="filter-clear" data-clear>Clear all</button>` : '');
  }

  function base() {
    return claims.filter(c => (!state.people.size || c.personas.some(p => state.people.has(p.id))) && (!state.topics.size || c.tags.some(t => state.topics.has(t))));
  }

  function controls(rows) {
    if (state.mode === '1') {
      return `<div class="toolbar"><p class="count-line">${rows.length} claims</p><div class="tools-right">
        <label class="toggle"><input type="checkbox" id="help" ${state.help ? 'checked' : ''}> Only claims that need help</label>
        <label class="sort">Sort by <select id="sortSel">${Object.entries(SORTS).map(([k, s]) => `<option value="${k}" ${state.sort === k ? 'selected' : ''}>${s.label}</option>`).join('')}</select></label></div></div>`;
    }
    if (state.mode === '2') {
      const tabs = { ...Object.fromEntries(Object.entries(SORTS).map(([k, s]) => [k, s])), help: { label: 'Needs help', icon: 'hand' } };
      return `<div class="tabs" role="tablist">${Object.entries(tabs).map(([k, t]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${ic(t.icon)}${t.label}${k === 'help' ? `<span class="n">${base().filter(NEEDS_HELP).length}</span>` : ''}</button>`).join('')}</div>`;
    }
    const all = base();
    return `<div class="mode"><button data-help="0" aria-pressed="${!state.helpMode}">${ic('search')}Find answers</button><button data-help="1" aria-pressed="${state.helpMode}">${ic('hand')}Help out</button></div>` +
      (state.helpMode
        ? `<div class="tasks">${Object.entries(TASKS).map(([k, t]) => `<button class="task" data-task="${k}" aria-pressed="${state.task === k}"><b>${ic(t.icon)}${t.label}</b><span>${t.sub}</span><span class="big">${all.filter(t.test).length}</span></button>`).join('')}</div>`
        : `<div class="toolbar"><p class="count-line">${rows.length} claims</p><label class="sort">Sort by <select id="sortSel">${Object.entries(SORTS).map(([k, s]) => `<option value="${k}" ${state.sort === k ? 'selected' : ''}>${s.label}</option>`).join('')}</select></label></div>`);
  }

  function card(c, signal, cta) {
    const r = c.top_response;
    return `<a class="claim-card" href="../argument.html?id=${c.id}">
      ${signal ? `<p class="signal ${cta ? 'warn' : ''}">${signal}</p>` : ''}
      <p class="claim-text">“${Proto.esc(Proto.clean(c.text))}”</p>
      ${r ? `<div class="claim-reply"><span class="claim-reply-label">How to answer</span><p>${Proto.esc(r.text)}</p></div>` : ''}
      <div class="claim-foot">${c.personas.slice(0, 2).map(p => `<span class="claim-persona"><span class="chip-dot" style="background:${col(p.id)}"></span>${Proto.esc(p.name)}</span>`).join('')}
        <span>${c.counter_argument_count} answer${c.counter_argument_count === 1 ? '' : 's'}</span>
        ${c.tags[0] ? `<span class="claim-tag">${cap(c.tags[0])}</span>` : ''}</div>
      ${cta ? `<span class="cta">${cta}</span>` : ''}</a>`;
  }

  function render() {
    pills();
    let rows = base(), sig = () => '', cta = null;
    if (state.mode === '1') {
      if (state.help) rows = rows.filter(NEEDS_HELP);
      const s = SORTS[state.sort]; rows.sort((a, b) => s.key(a) - s.key(b)); sig = s.signal;
    } else if (state.mode === '2') {
      if (state.tab === 'help') { rows = rows.filter(NEEDS_HELP).sort((a, b) => b.missing.length - a.missing.length); sig = TASKS.missing.signal; }
      else { const s = SORTS[state.tab]; rows.sort((a, b) => s.key(a) - s.key(b)); sig = s.signal; }
    } else if (state.helpMode) {
      const t = TASKS[state.task]; rows = rows.filter(t.test); sig = t.signal; cta = t.cta;
    } else {
      const s = SORTS[state.sort]; rows.sort((a, b) => s.key(a) - s.key(b)); sig = s.signal;
    }
    $('controls').innerHTML = controls(rows);
    $('list').innerHTML = rows.slice(0, 8).map(c => card(c, sig(c), cta && cta(c))).join('') || '<p class="feed-empty">Nothing here. Nice work!</p>';
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.closest('#switch')) return;
    const d = b.dataset;
    if (d.clear !== undefined) { state.people.clear(); state.topics.clear(); }
    else if (d.all) state[d.all].clear();
    else if (d.p) { const v = +d.p; state.people.has(v) ? state.people.delete(v) : state.people.add(v); }
    else if (d.t) { state.topics.has(d.t) ? state.topics.delete(d.t) : state.topics.add(d.t); }
    else if (d.tab) state.tab = d.tab;
    else if (d.help) state.helpMode = d.help === '1';
    else if (d.task) state.task = d.task;
    else return;
    render();
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'sortSel') state.sort = e.target.value;
    if (e.target.id === 'help') state.help = e.target.checked;
    render();
  });
  $('switch').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    state.mode = b.dataset.m;
    $('switch').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
  render();
})();
</script>
</body>
</html>
