<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype C · Conversation — re.inform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fbfbf9; --bubble: #eeefeb; --text: #191c1a; --muted: #6c746f; --line: #e6e8e3;
  --brand: #29683e; --on-brand: #ffffff; --gold: #d6b969;
}
:root[data-theme="dark"] {
  --bg: #0f1110; --bubble: #1f2321; --text: #e9ece9; --muted: #96a09a; --line: #262b28;
  --brand: #3f8a58; --on-brand: #ffffff;
}
* { box-sizing: border-box; margin: 0; }
p, h1 { overflow-wrap: anywhere; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.bar { max-width: 680px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 20px; }
.logo { font-weight: 700; letter-spacing: -0.03em; font-size: 18px; }
.logo b { color: var(--brand); }
nav { display: flex; gap: 18px; font-size: 15px; color: var(--muted); margin-left: auto; }
nav a:hover, nav a[aria-current] { color: var(--text); }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.icon-btn:hover { background: var(--bubble); }

.wrap { max-width: 680px; margin: 0 auto; padding: 24px 20px 120px; }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: -0.035em; font-weight: 700; }
h1 em { font-style: normal; color: var(--brand); }
.sub { color: var(--muted); margin-top: 10px; }

.who { margin-top: 28px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.who button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; white-space: nowrap; font-size: 12px; color: var(--muted); }
.who .av { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; outline: 2px solid transparent; outline-offset: 3px; transition: outline-color .15s; }
.who button[aria-pressed="true"] { color: var(--text); font-weight: 600; }
.who button[aria-pressed="true"] .av { outline-color: var(--brand); }

.search { display: flex; align-items: center; gap: 10px; margin: 24px 0 8px; padding: 0 16px; height: 48px; border-radius: 24px; background: var(--bubble); color: var(--muted); }
.search input { flex: 1; border: 0; background: none; font: inherit; color: var(--text); outline: none; }
.search:focus-within { box-shadow: 0 0 0 2px var(--brand); }

/* Conversation threads */
.thread { display: block; padding: 22px 0; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 10px; align-items: flex-end; }
.row.me { justify-content: flex-end; margin-top: 8px; }
.mini { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
.b { max-width: 82%; padding: 10px 14px; border-radius: 20px; }
.they .b { background: var(--bubble); border-bottom-left-radius: 6px; font-weight: 500; }
.me .b { background: var(--brand); color: var(--on-brand); border-bottom-right-radius: 6px; font-size: 15px; }
.me .b span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; justify-content: flex-end; gap: 12px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.thread:hover .meta .go { color: var(--brand); }
.more { display: block; margin: 24px auto 0; padding: 10px 20px; border-radius: 999px; background: var(--bubble); font-weight: 500; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

.fab { position: fixed; right: max(20px, calc(50% - 320px)); bottom: 24px; display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.proto-tag { position: fixed; bottom: 16px; left: 16px; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 10px; border-radius: 6px; opacity: .85; }
@media (max-width: 600px) { nav { display: none; } .logo { margin-right: auto; } }
</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="#">re<b>.</b>inform</a>
  <nav><a href="#" aria-current="page">Claims</a><a href="#">Personas</a><a href="#">Library</a><a href="#">Articles</a><a href="#">Log in</a></nav>
  <button class="icon-btn" id="theme" aria-label="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13.2A8.5 8.5 0 0 1 10.8 3 7 7 0 1 0 21 13.2Z"/></svg></button>
</header>

<main class="wrap">
  <h1>They said it.<br><em>Here's what to reply.</em></h1>
  <p class="sub">Real claims from dinners, comments and TV, with answers tested on real people.</p>

  <div class="who" id="who" role="group" aria-label="Who are you talking to?"></div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="What did they say?" aria-label="Search a claim"></label>
  <div id="list"></div>
  <button class="more" id="more" hidden>Show more</button>
</main>
<button class="fab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>I heard one</button>
<div class="proto-tag">Prototype C · Conversation</div>

<script src="proto-data.js"></script>
<script>
Proto.initTheme(document.getElementById('theme'));
(async () => {
  const { claims, personas } = await Proto.load();
  const state = { q: '', persona: null, shown: 8 };
  const $ = id => document.getElementById(id);
  const col = id => Proto.colorFor(personas, id);

  $('who').innerHTML = `<button data-p="" aria-pressed="true"><span class="av" style="background:var(--text);color:var(--bg)">All</span>Anyone</button>` +
    personas.map(p => `<button data-p="${p.id}" aria-pressed="false"><span class="av" style="background:${col(p.id)}">${Proto.esc(Proto.initials(p.name))}</span>${Proto.esc(Proto.firstName(p.name))}</button>`).join('');
  $('who').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    state.persona = b.dataset.p ? +b.dataset.p : null; state.shown = 8;
    $('who').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
  $('q').addEventListener('input', e => { state.q = e.target.value; state.shown = 8; render(); });
  $('more').addEventListener('click', () => { state.shown += 8; render(); });

  function render() {
    const rows = Proto.filter(claims, state);
    $('list').innerHTML = rows.slice(0, state.shown).map(c => {
      const r = c.top_response, p = c.personas[0];
      return `<a class="thread" href="../argument.html?id=${c.id}">
        <div class="row they">${p ? `<span class="mini" style="background:${col(p.id)}" title="${Proto.esc(p.name)}">${Proto.esc(Proto.initials(p.name))}</span>` : ''}
          <p class="b">${Proto.esc(Proto.clean(c.text))}</p></div>
        ${r ? `<div class="row me"><p class="b"><span>${Proto.esc(r.text)}</span></p></div>` : ''}
        <div class="meta"><span>${c.counter_argument_count} answer${c.counter_argument_count === 1 ? '' : 's'}</span><span class="go">See all →</span></div></a>`;
    }).join('') || `<p class="empty">No one has reported this one yet.</p>`;
    $('more').hidden = rows.length <= state.shown;
  }
  render();
})();
</script>
</body>
</html>
